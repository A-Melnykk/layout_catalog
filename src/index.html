<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Каталог</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <a
          href="#"
          class="nav__logo"
        >
          Каталог
        </a>
        <ul class="nav__list">
          <li>
            <a
              href="#"
              class="nav__link is-active"
            >
              Головна
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__link"
            >
              Контакти
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="catalog">
      <article class="card">
        <img
          class="card__image"
          src="./images/imac.jpeg"
          alt="iMac"
        />

        <h2 class="card__title">Apple IMac 24</h2>
        <p class="card__code">код: 213442345</p>
        <div class="card__rating">
          <span>★ 4.7</span>
          <span class="card__reviews">42 відгуки</span>
        </div>
        <p class="card__price">42 999 ₴</p>
        <a
          href="#"
          class="card__button"
        >
          Додати до кошика
        </a>
      </article>
    </main>
  </body>
</html>
